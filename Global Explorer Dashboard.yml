opencollection: 1.0.0
info:
  name: Global Explorer Dashboard
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: Get All Countries
      type: http
      seq: 1
    http:
      method: GET
      url: https://restcountries.com/v3.1/name/india
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Get Users
      type: http
      seq: 3
    http:
      method: GET
      url: https://jsonplaceholder.typicode.com/users
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Get Weather Data
      type: http
      seq: 2
    http:
      method: GET
      url: https://api.open-meteo.com/v1/forecast?latitude=17.3850&longitude=78.4867&current_weather=true
      params:
        - name: latitude
          value: '17.3850'
          type: query
        - name: longitude
          value: '78.4867'
          type: query
        - name: current_weather
          value: 'true'
          type: query
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-06-05T04:36:10.034Z'
    exportedUsing: Bruno

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Global Explorer Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🌍 Global Explorer Dashboard</h1>

    <div class="search-box">
        <input
            type="text"
            id="countryInput"
            placeholder="Enter Country Name (India, Japan, USA...)"
        >
        <button onclick="searchCountry()">🔍 Search</button>
    </div>

    <div id="countries">
        <h2>🌐 Country Information</h2>
        <p>Enter a country name and click Search.</p>
    </div>

    <div id="weather">
        <h2>☀️ Weather Information</h2>
    </div>

    <div id="users">
        <h2>👤 User Information</h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
